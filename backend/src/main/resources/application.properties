spring.application.name=backend

# ==========================================================================
# 🔌 ハイブリッド型データベースへの接続設定
# ==========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/defaultdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Tokyo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password123}

# ==========================================================================
# 📊 JPA/Hibernateの設定（データベース自動制御）
# ==========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================================================
# ⏰ タイムゾーン・日付の日本時間（JST）化設定
# ==========================================================================
spring.jackson.time-zone=Asia/Tokyo

# 🎯 本番環境でのCORS通信の初期セッションを完全に安定化させる設定
spring.mvc.cors.allow-credentials=false

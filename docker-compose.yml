services:
  db:
    image: mysql:8.0
    container_name: default-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: default-db
      MYSQL_USER: user
      MYSQL_PASSWORD: root_password
      TZ: "Asia/Tokyo"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
